<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#fff" stroke-width="1" fill="none">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Neural network nodes and connections -->
  <g opacity="0.3" stroke="#fff" stroke-width="2" fill="none">
    <!-- Connections -->
    <line x1="100" y1="180" x2="200" y2="140"/>
    <line x1="100" y1="180" x2="200" y2="220"/>
    <line x1="100" y1="320" x2="200" y2="280"/>
    <line x1="100" y1="320" x2="200" y2="360"/>
    <line x1="200" y1="140" x2="320" y2="180"/>
    <line x1="200" y1="220" x2="320" y2="180"/>
    <line x1="200" y1="280" x2="320" y2="320"/>
    <line x1="200" y1="360" x2="320" y2="320"/>
  </g>
  <g fill="#fff" opacity="0.25">
    <circle cx="100" cy="180" r="8"/>
    <circle cx="100" cy="320" r="8"/>
    <circle cx="200" cy="140" r="6"/>
    <circle cx="200" cy="220" r="6"/>
    <circle cx="200" cy="280" r="6"/>
    <circle cx="200" cy="360" r="6"/>
    <circle cx="320" cy="180" r="5"/>
    <circle cx="320" cy="320" r="5"/>
  </g>

  <!-- Central "L" with book/page motif -->
  <g transform="translate(256, 256)">
    <!-- Open book shape -->
    <path d="M-80,-20 Q-80,-70 -20,-70 L-20,60 Q-80,60 -80,20 Z" fill="#fff" opacity="0.15"/>
    <path d="M80,-20 Q80,-70 20,-70 L20,60 Q80,60 80,20 Z" fill="#fff" opacity="0.15"/>
    <line x1="0" y1="-70" x2="0" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>

    <!-- Main "L" character -->
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="160" font-weight="800" fill="#ffffff" letter-spacing="-5">
      L
    </text>
  </g>

  <!-- Sparkle accents -->
  <g fill="#fbbf24">
    <path d="M390,100 l5,15 l15,5 l-15,5 l-5,15 l-5,-15 l-15,-5 l15,-5 Z"/>
    <path d="M420,380 l3,10 l10,3 l-10,3 l-3,10 l-3,-10 l-10,-3 l10,-3 Z" opacity="0.8"/>
    <path d="M130,420 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 Z" opacity="0.6"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="160" y="440" width="192" height="6" rx="3" fill="url(#glow)" opacity="0.6"/>
</svg>
