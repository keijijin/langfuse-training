apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-training-videos
  labels:
    app: langfuse-training
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-external-storagecluster-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-training
  labels:
    app: langfuse-training
spec:
  replicas: 2
  selector:
    matchLabels:
      app: langfuse-training
  template:
    metadata:
      labels:
        app: langfuse-training
    spec:
      containers:
        - name: webapp
          image: image-registry.openshift-image-registry.svc:5000/langfuse-training/langfuse-training:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: videos
              mountPath: /app/public/videos
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
      volumes:
        - name: videos
          persistentVolumeClaim:
            claimName: langfuse-training-videos
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-training
  labels:
    app: langfuse-training
spec:
  selector:
    app: langfuse-training
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse-training
  labels:
    app: langfuse-training
spec:
  to:
    kind: Service
    name: langfuse-training
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
